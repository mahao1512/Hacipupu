<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bộ Sưu Tập Của Tôi — HACIPUPU Toy Box</title>
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Tailwind đã build sẵn (thay cho cdn.tailwindcss.com); đặt sau styles.css để giữ đúng thứ tự ưu tiên như bản CDN -->
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body data-page="collection" class="bg-toy-dots min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-10 space-y-8">
    <section class="hero-gradient rounded-[28px] p-6 sm:p-8 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
      <div class="space-y-2 max-w-2xl">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white text-purple-700 text-xs font-extrabold shadow-sm">⭐ My Collection</span>
        <h1 class="font-display font-bold text-3xl sm:text-4xl text-gray-900">Bộ Sưu Tập Của Tôi</h1>
        <p class="text-sm sm:text-base text-gray-600 font-semibold">
          Đánh dấu những mẫu bạn đã sở hữu. Mẫu <strong>đã có</strong> hiện đầy đủ hình ảnh, mẫu <strong>chưa có</strong> chỉ là một cái bóng đen mờ — hãy săn cho đủ bộ nhé!
        </p>
      </div>
      <div class="bg-white/90 rounded-3xl p-5 border border-white shadow-sm min-w-[260px]">
        <div class="text-[11px] font-extrabold uppercase text-gray-400">Tiến độ sưu tầm</div>
        <div class="font-display font-bold text-3xl text-gray-900"><span id="total-owned">0</span><span class="text-gray-300"> / </span><span id="total-figures">0</span></div>
        <div class="mt-2 h-3 rounded-full bg-gray-100 overflow-hidden">
          <div id="total-bar" class="h-full rounded-full bg-gradient-to-r from-[#FFD93D] via-[#FF6B6B] to-[#A78BFA] transition-all duration-500" style="width:0%"></div>
        </div>
        <div id="total-sets" class="mt-2 text-xs font-bold text-gray-500"></div>
      </div>
    </section>

    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="inline-flex items-center gap-1.5 bg-white p-1.5 rounded-2xl border border-gray-200 shadow-sm" role="group" aria-label="Lọc mẫu">
        <button type="button" data-coll-filter="all" class="coll-filter px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer">Tất cả</button>
        <button type="button" data-coll-filter="owned" class="coll-filter px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer">✓ Đã có</button>
        <button type="button" data-coll-filter="missing" class="coll-filter px-4 py-2 rounded-xl text-xs font-extrabold cursor-pointer">🌑 Chưa có</button>
      </div>
      <p class="text-xs font-bold text-gray-400">Bấm vào thẻ nhân vật để đánh dấu / bỏ đánh dấu “Đã có”. Dữ liệu lưu trên trình duyệt này.</p>
    </div>

    <div id="collection-root" class="space-y-8">
      <div class="h-64 rounded-3xl bg-white border border-gray-100 animate-pulse"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="data/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ai-config.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/blindbox.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
