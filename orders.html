<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đơn Hàng Của Tôi — HACIPUPU Toy Box</title>
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png?v=2" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Tailwind đã build sẵn (thay cho cdn.tailwindcss.com); đặt sau styles.css để giữ đúng thứ tự ưu tiên như bản CDN -->
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body data-page="my-orders" class="bg-toy-dots min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-10 space-y-7">
    <section class="hero-gradient rounded-[28px] p-6 sm:p-8 flex flex-col md:flex-row md:items-center justify-between gap-5">
      <div class="space-y-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white text-amber-700 text-xs font-extrabold shadow-sm">🧾 My Orders</span>
        <h1 class="font-display font-bold text-3xl sm:text-4xl text-gray-900">Đơn Hàng Của Tôi</h1>
        <p class="text-sm sm:text-base text-gray-600 font-semibold max-w-xl">
          Theo dõi các đơn bạn đã đặt: Chờ xác nhận → Đã xác nhận → Đang vận chuyển → Đã nhận hàng.
        </p>
      </div>
      <div class="grid grid-cols-3 gap-3 shrink-0">
        <div class="bg-white/90 rounded-2xl px-4 py-3 text-center border border-white shadow-sm">
          <div id="count-all" class="font-display font-bold text-2xl text-gray-900">0</div>
          <div class="text-[11px] font-extrabold uppercase text-gray-400">Tổng đơn</div>
        </div>
        <div class="bg-white/90 rounded-2xl px-4 py-3 text-center border border-white shadow-sm">
          <div id="count-active" class="font-display font-bold text-2xl text-[#4D96FF]">0</div>
          <div class="text-[11px] font-extrabold uppercase text-gray-400">Đang xử lý</div>
        </div>
        <div class="bg-white/90 rounded-2xl px-4 py-3 text-center border border-white shadow-sm">
          <div id="count-done" class="font-display font-bold text-2xl text-emerald-600">0</div>
          <div class="text-[11px] font-extrabold uppercase text-gray-400">Đã nhận</div>
        </div>
      </div>
    </section>

    <div id="my-order-filters" class="flex flex-wrap gap-2" role="group" aria-label="Lọc đơn hàng"></div>

    <div id="my-orders-list" class="space-y-4">
      <div class="h-48 rounded-3xl bg-white border border-gray-100 animate-pulse"></div>
    </div>

    <p class="text-xs font-bold text-gray-400 text-center">
      Đơn hàng được lưu trên trình duyệt này. Trạng thái tự cập nhật khi nhân viên duyệt đơn.
    </p>
  </main>

  <div id="site-footer"></div>

  <script src="data/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ai-config.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
